name: Online Doctor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  app-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Verify Online Doctor files
        run: |
          test -f package.json
          test -f server.js
          test -f index.html
          test -f app.js
          test -f styles.css
