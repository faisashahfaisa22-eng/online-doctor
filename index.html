<!doctype html><html lang="ps" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b63"><title>Online Doctor</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><header><div><b>🩺 Online Doctor</b><small id="tag"></small></div><select id="lang"><option value="ps">پښتو</option><option value="fa">دری</option><option value="en">English</option><option value="ur">اردو</option></select></header>
<nav><button data-tab="chat" class="active" id="nChat"></button><button data-tab="scan" id="nScan"></button><button data-tab="profile" id="nProfile"></button><button data-tab="history" id="nHistory"></button><button data-tab="settings" id="nSettings"></button></nav>
<main>
<section id="chat" class="tab active"><div class="card"><h2 id="hello"></h2><p id="intro"></p><div class="severity"><span>🟢 Self-care</span><span>🟠 Doctor</span><span>🔴 Emergency</span></div></div><div class="card"><div id="messages" class="messages"></div><div class="composer"><textarea id="input"></textarea><div><button id="voice">🎙️ <span id="voiceLbl"></span></button><button id="send">➤ <span id="sendLbl"></span></button></div></div></div></section>
<section id="scan" class="tab"><div class="card"><h2 id="scanTitle"></h2><p id="scanHelp"></p><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" hidden><button id="scanBtn"></button><pre id="scanOut"></pre></div></section>
<section id="profile" class="tab"><div class="card"><h2 id="profileTitle"></h2><div class="grid"><label><span id="ageLbl"></span><input id="age" type="number" min="0" max="130"></label><label><span id="weightLbl"></span><input id="weight" type="number" min="0.5" max="400" step="0.1"></label><label><span id="tempLbl"></span><input id="temp" type="number" min="30" max="45" step="0.1"></label><label><span id="allergyLbl"></span><input id="allergies"></label><label><span id="medsLbl"></span><input id="meds"></label><label><span id="conditionsLbl"></span><input id="conditions"></label></div><button id="saveProfile"></button></div></section>
<section id="history" class="tab"><div class="card"><h2 id="historyTitle"></h2><div id="historyList"></div><button id="clearHistory"></button></div></section>
<section id="settings" class="tab"><div class="card"><h2 id="settingsTitle"></h2><label class="check"><input id="speak" type="checkbox" checked><span id="speakLbl"></span></label><label><span id="apiLbl"></span><input id="apiBase" placeholder="https://your-server.example.com"></label><button id="saveSettings"></button><p class="warning" id="medicalNote"></p></div></section>
</main></div><script src="app.js"></script></body></html>
